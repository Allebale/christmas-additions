id = christmas-additions
name = Christmas Additions
version = 1.8.0
author = Allebale
description = Christmas in Isle Delfino. Piantas wear Santa hats and winter colours, Strollin' Stu stacks become snowmen, snow falls and Mario leaves white footprints in snowy levels, and coming back through a level's door starts Mario beside it, Yoshi is Rudolph the red-nosed reindeer, Mario can dress as Santa or an elf, FLUDD comes wrapped for Christmas and can throw snowballs, and the FLUDD Weapons mod's black goop turns to ice. Each part can be switched off in the Mods menu. Needs a game with api->parts (Super Mario Sunshine Remastered, or the snowman-enemy build).
library = christmas_additions
