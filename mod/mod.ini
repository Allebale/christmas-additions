description = Christmas in Isle Delfino. Piantas wear Santa hats and winter colours, Strollin' Stu stacks become snowmen, snow falls and Mario leaves white footprints in snowy levels, and coming back through a level's door starts Mario beside it, Yoshi is Rudolph the red-nosed reindeer, Mario can dress as Santa and FLUDD comes wrapped for Christmas. Each part can be switched off in the Mods menu. Needs Super Mario Sunshine Remastered (its api->parts).
